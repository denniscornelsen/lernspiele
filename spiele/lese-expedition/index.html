<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lese-Expedition · Knobelkiste</title>
  <link rel="icon" href="../../gemeinsam/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../gemeinsam/stil.css">
  <link rel="stylesheet" href="spiel.css">
</head>
<body>
  <main class="seite">
    <header class="kopf">
      <a class="logo" href="../../index.html" id="start-link">← Knobelkiste</a>
      <h1>Lese-Expedition</h1>
      <a class="knopf klein" id="arbeitsblatt-link" href="arbeitsblatt.html">Arbeitsblatt</a>
    </header>

    <!-- Karte -->
    <section id="karte">
      <p class="anleitung">Reise von Station zu Station. Lies den Text genau, dann findest du alle Antworten. Wähle eine Station:</p>
      <div class="landkarte" id="landkarte"></div>
      <div class="kacheln" id="stationen"></div>
    </section>

    <!-- Station -->
    <section id="station" class="versteckt">
      <div class="leiste">
        <span id="station-name"></span>
        <button class="knopf klein" id="zur-karte" type="button">Zur Karte</button>
      </div>
      <div class="station-raster">
        <article class="lesetext" id="lesetext" aria-label="Lesetext">
          <span class="art" id="text-art"></span>
          <h2 id="text-titel"></h2>
          <div id="text-absaetze"></div>
        </article>
        <aside class="fragen-karte" aria-live="polite">
          <div class="fragen-kopf">
            <span id="fragen-fortschritt"></span>
            <button class="knopf klein versteckt" id="vorlesen" type="button" aria-label="Frage vorlesen"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg> Frage</button>
          </div>
          <p class="frage" id="frage"></p>
          <div class="antworten" id="antworten"></div>
          <div class="hinweis versteckt" id="hinweis" role="status"></div>
          <button class="knopf haupt versteckt" id="weiter" type="button">Weiter</button>
        </aside>
      </div>
    </section>

    <!-- Ergebnis -->
    <section id="ergebnis" class="versteckt">
      <div class="ergebnis-karte">
        <div class="ergebnis-sterne" id="ergebnis-sterne"></div>
        <h2 id="ergebnis-titel"></h2>
        <p id="ergebnis-text"></p>
        <p class="ergebnis-knoepfe">
          <button class="knopf haupt" id="naechste" type="button">Nächste Station</button>
          <button class="knopf" id="zurueck-karte" type="button">Zur Karte</button>
        </p>
      </div>
    </section>

    <p class="fehlermeldung versteckt" id="fehlermeldung"></p>
  </main>

  <script src="../../gemeinsam/app.js"></script>
  <script src="text.js"></script>
  <script src="spiel.js"></script>
</body>
</html>
